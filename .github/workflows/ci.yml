name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # scripts/run-tests.mjs: typecheck -> build -> smoke -> every discovered
      # tests/*.mjs (build-watch and package-contract last).
      - name: Typecheck, runtime tests, and package contract
        run: npm test
      - name: Documentation links, commands, subpaths, and budget table
        run: npm run check:docs

  performance:
    name: Performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle budgets (published artifacts and consumer scenarios)
        run: npm run check:size
      - run: node scripts/benchmark.mjs --check
      # Smoke run of the Chromium widget benchmark at the smallest size: proves
      # the harness still drives the widget and catches order-of-magnitude
      # regressions against the portable 1k budgets in widget-baseline.json.
      - run: npx playwright install --with-deps chromium
      - name: Widget browser benchmark smoke (1k bars)
        run: node scripts/benchmark-widget.mjs --check --sizes=1k

  visual:
    name: Visual regression
    # Goldens are captured on Windows Chromium. Linux font rasterization is
    # intentionally not used as the screenshot oracle.
    runs-on: windows-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
