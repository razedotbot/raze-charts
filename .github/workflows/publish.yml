name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Fail early and explain why: the release tag must match package.json, a
      # version already on npm (for example published by hand) is skipped
      # instead of failing, and a missing token says how to add it.
      - name: Check release tag, version and npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version v$version. Bump the version or retag the release."
            exit 1
          fi
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
          elif [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is missing. Create an npm automation (or granular publish) token for $name and add it under Settings > Secrets and variables > Actions as NPM_TOKEN, then re-run this workflow."
            exit 1
          fi
      # npm publish runs prepublishOnly (the portable quality gate) and prepack.
      # Screenshot goldens remain in CI's dedicated Windows visual job.
      - if: env.SKIP_PUBLISH != '1'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
